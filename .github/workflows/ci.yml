name: Control CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository quality gates
        run: npm run check

      - name: Validate production HA deployment assets
        run: |
          trap 'rm -rf .env.production secrets backups' EXIT
          npm run bootstrap:production -- \
            --environment production \
            --public-url https://control.ci.otto.cn \
            --federation-public-url https://federation.ci.otto.cn \
            --acme-email ci@otto.cn \
            --privacy-controller "Otto CI" \
            --privacy-contact ci@otto.cn \
            --data-region CN-BJ
          npm run preflight:deployment -- --env-file .env.production --skip-dns
          sh -n deploy/*.sh deploy/postgres-ha/*.sh deploy/postgres-ha/otto-pgbackrest

      - name: Reject whitespace errors
        run: git diff --check

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: otto_control
          POSTGRES_PASSWORD: otto-control-ci-password
          POSTGRES_DB: otto_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otto_control -d otto_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      CONTROL_REQUIRE_POSTGRES_TEST: "true"
      CONTROL_TEST_DATABASE_URL: postgresql://otto_control:otto-control-ci-password@127.0.0.1:5432/otto_control_test
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Exercise migrations and commercial transactions on PostgreSQL
        run: npm run test:postgres

  container:
    name: Build production container
    needs: [quality, postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build production image
        run: docker build --tag otto-control:ci .

      - name: Build Patroni and pgBackRest image
        run: >-
          docker build
          --file deploy/postgres-ha/Dockerfile
          --build-arg PATRONI_VERSION=4.1.4
          --tag otto-control-postgres-ha:ci
          .

  ha-smoke:
    name: PostgreSQL failover and PITR smoke test
    needs: [quality, postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Bootstrap disposable HA identity
        run: >-
          npm run bootstrap:production --
          --environment production
          --public-url https://control.ci.otto.cn
          --federation-public-url https://federation.ci.otto.cn
          --acme-email ci@otto.cn
          --privacy-controller "Otto CI"
          --privacy-contact ci@otto.cn
          --data-region CN-BJ

      - name: Start database quorum, Control, and Federation instances
        run: |
          docker compose -f compose.production.yaml -f compose.ci.yaml \
            --env-file .env.production config > compose.ci.resolved.yaml
          trap 'docker compose -f compose.ci.resolved.yaml logs --no-color' ERR
          docker compose -f compose.ci.resolved.yaml \
            up --detach --build --wait --wait-timeout 300 \
            control-a control-b control-c federation-a federation-b federation-c caddy

      - name: Prove all Control instances are ready
        run: |
          for instance in control-a control-b control-c; do
            docker compose -f compose.ci.resolved.yaml \
              exec -T "$instance" node -e \
              "fetch('http://127.0.0.1:7788/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          done

      - name: Prove all Federation instances and encrypted relay are ready
        run: |
          for instance in federation-a federation-b federation-c; do
            docker compose -f compose.ci.resolved.yaml \
              exec -T "$instance" node -e \
              "fetch('http://127.0.0.1:7790/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          done
          docker compose -f compose.ci.resolved.yaml \
            exec -T federation-a node --input-type=module < scripts/smoke-federation.mjs

      - name: Prove the edge survives every Control replica failure
        env:
          OTTO_CONTROL_COMPOSE_FILE: ${{ github.workspace }}/compose.ci.resolved.yaml
          OTTO_CONTROL_FAILOVER_EDGE_URL: http://127.0.0.1:18080
        run: sh deploy/drill-control-failover.sh --confirm=FAILOVER_OTTO_CONTROL_REPLICAS

      - name: Exercise encrypted physical backup and automatic failover
        env:
          OTTO_CONTROL_COMPOSE_FILE: ${{ github.workspace }}/compose.ci.resolved.yaml
        run: |
          sh deploy/backup-pitr-postgres.sh full
          sh deploy/drill-postgres-failover.sh --confirm=FAILOVER_OTTO_CONTROL

      - name: Restore an isolated PITR instance
        env:
          OTTO_CONTROL_COMPOSE_FILE: ${{ github.workspace }}/compose.ci.resolved.yaml
        run: sh deploy/drill-pitr-postgres.sh

      - name: Validate Caddy load-balancer configuration
        run: >-
          docker compose -f compose.production.yaml --env-file .env.production
          run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile

      - name: Print diagnostics and clean up
        if: always()
        run: |
          if [ -f compose.ci.resolved.yaml ]; then
            docker compose -f compose.ci.resolved.yaml ps || true
            docker compose -f compose.ci.resolved.yaml logs --no-color --tail=500 || true
            docker compose -f compose.ci.resolved.yaml down --volumes --remove-orphans || true
          fi
          rm -f compose.ci.resolved.yaml

