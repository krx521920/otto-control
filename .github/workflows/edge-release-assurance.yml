name: Edge production assurance

on:
  pull_request:
    paths:
      - .github/workflows/edge-release-assurance.yml
      - security/edge-release-assurance-status.json
      - scripts/check-edge-release-assurance.mjs
      - scripts/drill-esa-keyring-revocation.mjs
      - scripts/preflight-aliyun-esa-iac.mjs
      - deploy/aliyun-esa/**
      - test/edge-release-assurance.test.ts
  push:
    tags:
      - edge-v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status-integrity:
    name: Validate assurance status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1

      - name: Validate declarations without inventing approval
        if: github.event_name == 'pull_request'
        run: node scripts/check-edge-release-assurance.mjs --allow-pending

      - name: Enforce real evidence for a release
        if: github.event_name != 'pull_request'
        run: node scripts/check-edge-release-assurance.mjs
