name: Otto enforcement contract

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/otto-enforcement-contract.yml"
      - "docs/otto-commercial-enforcement-v1.*"
      - "src/contracts/license.ts"
      - "src/modules/billing/**"
      - "src/modules/commercial-control/**"
      - "src/storage/**"
      - "test/billing.test.ts"
      - "test/commercial-control.test.ts"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/otto-enforcement-contract.yml"
      - "docs/otto-commercial-enforcement-v1.*"
      - "src/contracts/license.ts"
      - "src/modules/billing/**"
      - "src/modules/commercial-control/**"
      - "src/storage/**"
      - "test/billing.test.ts"
      - "test/commercial-control.test.ts"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: otto-enforcement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Control commercial contract conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OTTO_ENFORCEMENT_V1_SHA256: af4217872dae276edae3101f211a8b7e685cc58356263ff025a938ced53d6ec5
    steps:
      - name: Check out Control
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1

      - name: Verify the versioned protocol fingerprint
        run: echo "${OTTO_ENFORCEMENT_V1_SHA256}  docs/otto-commercial-enforcement-v1.json" | sha256sum --check --strict

      - name: Install Control dependencies
        run: npm ci

      - name: Verify Control signing, billing, and idempotency
        run: npm exec -- vitest run test/commercial-control.test.ts test/billing.test.ts
