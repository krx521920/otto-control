name: Otto enforcement contract

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/otto-enforcement-contract.yml"
      - "docs/otto-commercial-enforcement-v1.*"
      - "src/contracts/license.ts"
      - "src/modules/billing/**"
      - "src/modules/commercial-control/**"
      - "src/storage/**"
      - "test/billing.test.ts"
      - "test/commercial-control.test.ts"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/otto-enforcement-contract.yml"
      - "docs/otto-commercial-enforcement-v1.*"
      - "src/contracts/license.ts"
      - "src/modules/billing/**"
      - "src/modules/commercial-control/**"
      - "src/storage/**"
      - "test/billing.test.ts"
      - "test/commercial-control.test.ts"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: otto-enforcement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Control and Otto fail-closed conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Control
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: control

      - name: Check out Otto internal
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: Felix201209/otto
          ref: internal
          path: otto

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1

      - name: Verify the machine-readable protocol is identical
        run: cmp control/docs/otto-commercial-enforcement-v1.json otto/docs/otto-commercial-enforcement-v1.json

      - name: Install Control dependencies
        working-directory: control
        run: npm ci

      - name: Verify Control signing, billing, and idempotency
        working-directory: control
        run: npm exec -- vitest run test/commercial-control.test.ts test/billing.test.ts

      - name: Install Otto dependencies
        working-directory: otto
        run: npm ci

      - name: Verify Otto execution enforcement and durable settlement
        working-directory: otto
        run: >-
          npm exec -- vitest run
          packages/server/src/modules/authorization/commercialRoutePolicy.test.ts
          packages/server/src/modules/commercial_control/commercialBillingRoutePolicy.test.ts
          packages/server/src/modules/commercial_control/billingAdmissionRepository.test.ts
          packages/server/src/modules/commercial_control/deploymentRepository.test.ts
          packages/server/src/modules/commercial_control/privateDeploymentSchema.test.ts
          packages/server/src/modules/integration_adapters/integrationAdaptersComposition.test.ts

      - name: Exercise the Otto HTTP admission boundary
        working-directory: otto
        run: >-
          npm exec -- vitest run packages/server/src/enterprise/server.test.ts
          -t "private deployment license enforcement|signed private deployment license|enforces Control credit admission"
