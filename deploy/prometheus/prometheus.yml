global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: otto-control
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/control_metrics_token
    static_configs:
      - targets:
          - control-a:7788
          - control-b:7788
          - control-c:7788
  - job_name: otto-federation
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/federation_metrics_token
    static_configs:
      - targets:
          - federation-a:7790
          - federation-b:7790
          - federation-c:7790
