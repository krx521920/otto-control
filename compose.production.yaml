name: otto-control

x-postgres-common: &postgres-common
  image: ${POSTGRES_HA_IMAGE:-otto-control-postgres-ha:local}
  build:
    context: .
    dockerfile: deploy/postgres-ha/Dockerfile
  restart: unless-stopped
  depends_on:
    etcd-1:
      condition: service_healthy
    etcd-2:
      condition: service_healthy
    etcd-3:
      condition: service_healthy
  secrets:
    - postgres_password
    - postgres_superuser_password
    - postgres_replication_password
    - pgbackrest_cipher_pass
  expose:
    - "5432"
    - "8008"
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8008/readiness"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 30s
  networks:
    - database
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    - /run/patroni:rw,noexec,nosuid,size=2m,mode=0700
    - /var/run/postgresql:rw,noexec,nosuid,size=2m
    - /var/log/pgbackrest:rw,noexec,nosuid,size=16m
  security_opt:
    - no-new-privileges:true

x-control-common: &control-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  env_file:
    - .env.production
  depends_on:
    postgres-tools:
      condition: service_healthy
  expose:
    - "7788"
  secrets:
    - control_admin_token
    - control_token_secret
    - control_metrics_token
    - source: control_signer_private_key
      target: control_signer_private_key.pem
    - postgres_password
    - alert_webhook_secret
    - audit_anchor_token
  volumes:
    - ./secrets:/run/otto-secrets:ro
    - ./backups/reports:/var/lib/otto-control/backup-reports:ro
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    - /run/otto-runtime-secrets:rw,noexec,nosuid,size=1m,uid=1000,gid=1000,mode=0700
  networks:
    - backend
    - edge
    - monitoring
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - DAC_READ_SEARCH
    - SETGID
    - SETUID

x-federation-common: &federation-common
  build:
    context: .
    dockerfile: Dockerfile
  command: ["node", "dist/federation-server.js"]
  restart: unless-stopped
  init: true
  env_file:
    - .env.production
  environment:
    FEDERATION_HOST: 0.0.0.0
    FEDERATION_PORT: "7790"
    FEDERATION_PUBLIC_BASE_URL: https://${FEDERATION_DOMAIN}
    FEDERATION_DATABASE_HOST: postgres-router
    FEDERATION_DATABASE_PORT: "5432"
    FEDERATION_DATABASE_NAME: ${POSTGRES_DB:-otto_control}
    FEDERATION_DATABASE_USER: ${POSTGRES_USER:-otto_control}
    FEDERATION_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    FEDERATION_ADMIN_TOKEN_FILE: /run/secrets/federation_admin_token
    FEDERATION_METRICS_TOKEN_FILE: /run/secrets/federation_metrics_token
  depends_on:
    postgres-tools:
      condition: service_healthy
  expose:
    - "7790"
  secrets:
    - federation_admin_token
    - federation_metrics_token
    - postgres_password
  volumes:
    - ./secrets:/run/otto-secrets:ro
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    - /run/otto-runtime-secrets:rw,noexec,nosuid,size=1m,uid=1000,gid=1000,mode=0700
  networks:
    - backend
    - edge
    - monitoring
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7790/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    start_period: 10s
    retries: 3
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - DAC_READ_SEARCH
    - SETGID
    - SETUID

services:
  etcd-1:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.21}
    restart: unless-stopped
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=otto-control-postgres
    volumes:
      - etcd_1_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
    security_opt: [no-new-privileges:true]

  etcd-2:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.21}
    restart: unless-stopped
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=otto-control-postgres
    volumes:
      - etcd_2_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
    security_opt: [no-new-privileges:true]

  etcd-3:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.21}
    restart: unless-stopped
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=otto-control-postgres
    volumes:
      - etcd_3_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
    security_opt: [no-new-privileges:true]

  postgres-1:
    <<: *postgres-common
    environment:
      PATRONI_NAME: postgres-1
    volumes:
      - postgres_1_data:/var/lib/postgresql/data
      - pgbackrest_repository:/var/lib/pgbackrest

  postgres-2:
    <<: *postgres-common
    environment:
      PATRONI_NAME: postgres-2
    volumes:
      - postgres_2_data:/var/lib/postgresql/data
      - pgbackrest_repository:/var/lib/pgbackrest

  postgres-3:
    <<: *postgres-common
    environment:
      PATRONI_NAME: postgres-3
    volumes:
      - postgres_3_data:/var/lib/postgresql/data
      - pgbackrest_repository:/var/lib/pgbackrest

  postgres-router:
    image: haproxy:3.1-alpine
    restart: unless-stopped
    depends_on:
      postgres-1: { condition: service_started }
      postgres-2: { condition: service_started }
      postgres-3: { condition: service_started }
    expose: ["5432"]
    volumes:
      - ./deploy/postgres-ha/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database, backend]
    security_opt: [no-new-privileges:true]

  postgres-tools:
    image: ${POSTGRES_HA_IMAGE:-otto-control-postgres-ha:local}
    restart: unless-stopped
    depends_on:
      postgres-router:
        condition: service_healthy
    environment:
      PGDATABASE: ${POSTGRES_DB:-otto_control}
      PGHOST: postgres-router
      PGPASSFILE: /tmp/.pgpass
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-otto_control}
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password="$$(cat /run/secrets/postgres_password)"
        printf '%s:%s:%s:%s:%s\n' "$$PGHOST" "$$PGPORT" "$$PGDATABASE" "$$PGUSER" "$$password" |
          gosu postgres sh -c 'umask 077; cat > "$$PGPASSFILE"'
        unset password
        exec gosu postgres tail -f /dev/null
    secrets: [postgres_password]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=$$PGHOST --port=$$PGPORT --username=$$PGUSER --dbname=$$PGDATABASE"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SETGID, SETUID]

  control-a:
    <<: *control-common

  control-b:
    <<: *control-common

  control-c:
    <<: *control-common

  federation-a:
    <<: *federation-common

  federation-b:
    <<: *federation-common

  federation-c:
    <<: *federation-common

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: [.env.production]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    security_opt: [no-new-privileges:true]

  prometheus:
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.0-distroless}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    ports:
      - "127.0.0.1:9090:9090"
    secrets: [control_metrics_token, federation_metrics_token]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  postgres-pitr-drill:
    profiles: [ops]
    build:
      context: .
      dockerfile: deploy/postgres-ha/Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    user: root
    read_only: true
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      OTTO_PGBACKREST_CIPHER_FILE: /run/patroni/pgbackrest_cipher_pass
    command:
      - |
        gosu postgres sh -c 'umask 077; cat > /run/patroni/pgbackrest_cipher_pass' < /run/secrets/pgbackrest_cipher_pass
        exec gosu postgres tail -f /dev/null
    secrets: [pgbackrest_cipher_pass]
    volumes:
      - postgres_pitr_drill_data:/var/lib/postgresql/data
      - pgbackrest_repository:/var/lib/pgbackrest:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /run/patroni:rw,noexec,nosuid,size=1m,uid=999,gid=999,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,size=2m,mode=1777
      - /var/log/pgbackrest:rw,noexec,nosuid,size=16m,mode=1777
    networks: [database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SETGID, SETUID]

secrets:
  control_admin_token:
    file: ./secrets/control_admin_token
  control_token_secret:
    file: ./secrets/control_token_secret
  control_metrics_token:
    file: ./secrets/control_metrics_token
  federation_admin_token:
    file: ./secrets/federation_admin_token
  federation_metrics_token:
    file: ./secrets/federation_metrics_token
  control_signer_private_key:
    file: ./secrets/control_signer_private_key.pem
  postgres_password:
    file: ./secrets/postgres_password
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  postgres_replication_password:
    file: ./secrets/postgres_replication_password
  pgbackrest_cipher_pass:
    file: ./secrets/pgbackrest_cipher_pass
  alert_webhook_secret:
    file: ./secrets/alert_webhook_secret
  audit_anchor_token:
    file: ./secrets/audit_anchor_token

volumes:
  etcd_1_data:
  etcd_2_data:
  etcd_3_data:
  postgres_1_data:
  postgres_2_data:
  postgres_3_data:
  postgres_pitr_drill_data:
  pgbackrest_repository:
  caddy_data:
  caddy_config:
  prometheus_data:

networks:
  database:
    internal: true
  backend:
    internal: true
  edge:
  monitoring:
    internal: true
