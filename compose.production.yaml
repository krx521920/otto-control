name: ${OTTO_CONTROL_STACK_NAME:-otto-control}

x-postgres-common: &postgres-common
  image: ${POSTGRES_HA_IMAGE:-otto-control-postgres-ha:local}
  build:
    context: .
    dockerfile: deploy/postgres-ha/Dockerfile
  restart: unless-stopped
  depends_on:
    etcd-1:
      condition: service_healthy
    etcd-2:
      condition: service_healthy
    etcd-3:
      condition: service_healthy
  secrets:
    - postgres_password
    - postgres_superuser_password
    - postgres_replication_password
    - pgbackrest_cipher_pass
    - postgres_tls_ca
    - postgres_tls_cert
    - postgres_tls_key
  expose:
    - "5432"
    - "8008"
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8008/readiness"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 30s
  networks:
    - database
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    - /run/patroni:rw,noexec,nosuid,size=2m,mode=0700
    - /var/run/postgresql:rw,noexec,nosuid,size=2m
    - /var/log/pgbackrest:rw,noexec,nosuid,size=16m
  security_opt:
    - no-new-privileges:true

x-control-common: &control-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  env_file:
    - ${OTTO_CONTROL_ENV_FILE:-.env.production}
  depends_on:
    postgres-tools:
      condition: service_healthy
  expose:
    - "7788"
  secrets:
    - control_admin_token
    - control_token_secret
    - control_metrics_token
    - postgres_password
    - postgres_tls_ca
    - alert_webhook_secret
    - audit_anchor_token
    - artifact_s3_access_key_id
    - artifact_s3_secret_access_key
    - artifact_s3_session_token
  volumes:
    - ${OTTO_CONTROL_BACKUP_DIR:-./backups}/reports:/var/lib/otto-control/backup-reports:ro
    - ${OTTO_CONTROL_SIGNING_DIR:-./signing}:/run/otto-secrets:ro
    - ${OTTO_CONTROL_ATTESTATION_DIR:-./attestations}:/run/otto-attestations:ro
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    - /run/otto-runtime-secrets:rw,noexec,nosuid,size=1m,uid=1000,gid=1000,mode=0700
  networks:
    - backend
    - edge
    - monitoring
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - DAC_READ_SEARCH
    - SETGID
    - SETUID

x-federation-common: &federation-common
  build:
    context: .
    dockerfile: Dockerfile
  command: ["node", "dist/federation-server.js"]
  restart: unless-stopped
  init: true
  env_file:
    - ${OTTO_CONTROL_ENV_FILE:-.env.production}
  environment:
    FEDERATION_HOST: 0.0.0.0
    FEDERATION_PORT: "7790"
    FEDERATION_PUBLIC_BASE_URL: https://${FEDERATION_DOMAIN}
    FEDERATION_DATABASE_HOST: postgres-router
    FEDERATION_DATABASE_PORT: "5432"
    FEDERATION_DATABASE_NAME: ${POSTGRES_DB:-otto_control}
    FEDERATION_DATABASE_USER: ${POSTGRES_USER:-otto_control}
    FEDERATION_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    FEDERATION_ADMIN_TOKEN_FILE: /run/secrets/federation_admin_token
    FEDERATION_METRICS_TOKEN_FILE: /run/secrets/federation_metrics_token
  depends_on:
    postgres-tools:
      condition: service_healthy
  expose:
    - "7790"
  secrets:
    - federation_admin_token
    - federation_metrics_token
    - artifact_s3_access_key_id
    - artifact_s3_secret_access_key
    - artifact_s3_session_token
    - postgres_password
    - postgres_tls_ca
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    - /run/otto-runtime-secrets:rw,noexec,nosuid,size=1m,uid=1000,gid=1000,mode=0700
  networks:
    - backend
    - edge
    - monitoring
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7790/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    start_period: 10s
    retries: 3
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - DAC_READ_SEARCH
    - SETGID
    - SETUID

x-edge-gateway-common: &edge-gateway-common
  image: ${OTTO_EDGE_IMAGE:-otto-control-edge:local}
  build:
    context: .
    dockerfile: Dockerfile
  entrypoint: ["/usr/local/bin/otto-edge-entrypoint"]
  command: ["node", "dist/edge-gateway/server.js"]
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  env_file:
    - ${OTTO_CONTROL_ENV_FILE:-.env.production}
  environment:
    OTTO_EDGE_HOST: 0.0.0.0
    OTTO_EDGE_PORT: "7791"
    OTTO_EDGE_CONTROL_URL: https://${CONTROL_DOMAIN}
    OTTO_EDGE_CONTROL_PUBLIC_KEYS_FILE: /run/secrets/edge_control_public_keys
    OTTO_EDGE_UPSTREAM_ORIGINS_FILE: /run/secrets/edge_upstream_origins
    OTTO_EDGE_DEPLOYMENT_IDENTITY_FILE: /run/secrets/edge_deployment_identity
    OTTO_EDGE_LEASE_TOKEN_FILE: /run/secrets/edge_lease_token
    OTTO_EDGE_RATE_LIMIT_BACKEND: redis
    OTTO_EDGE_REDIS_URL: rediss://edge-redis:6379/0
    OTTO_EDGE_REDIS_PASSWORD_FILE: /run/secrets/edge_redis_password
    OTTO_EDGE_REDIS_CA_FILE: /run/secrets/edge_redis_tls_ca
    OTTO_EDGE_REDIS_SERVER_NAME: edge-redis
    OTTO_EDGE_REDIS_ALLOW_INSECURE: "false"
    OTTO_EDGE_RATE_LIMIT_KEY_FILE: /run/secrets/edge_rate_limit_key
    OTTO_EDGE_BILLING_BACKEND: control
    OTTO_EDGE_BILLING_NODE_ID: ${OTTO_EDGE_BILLING_NODE_ID:-}
    OTTO_EDGE_EXECUTION_RECEIPT_KEY_FILE: /run/secrets/edge_execution_receipt_key
    OTTO_EDGE_BILLING_JOURNAL_FILE: /var/lib/otto-edge/billing-journal.ndjson
    OTTO_EDGE_REQUEST_LEDGER_BACKEND: postgres
    OTTO_EDGE_REQUEST_LEDGER_DATABASE_HOST: postgres-router
    OTTO_EDGE_REQUEST_LEDGER_DATABASE_PORT: "5432"
    OTTO_EDGE_REQUEST_LEDGER_DATABASE_NAME: ${POSTGRES_DB:-otto_control}
    OTTO_EDGE_REQUEST_LEDGER_DATABASE_USER: otto_edge_ledger
    OTTO_EDGE_REQUEST_LEDGER_DATABASE_PASSWORD_FILE: /run/secrets/edge_ledger_postgres_password
    OTTO_EDGE_REQUEST_LEDGER_DATABASE_SSL: "true"
    OTTO_EDGE_REQUEST_LEDGER_MANAGE_SCHEMA: "false"
    OTTO_EDGE_REQUEST_LEDGER_LEASE_MS: ${OTTO_EDGE_REQUEST_LEDGER_LEASE_MS:-7200000}
    NODE_EXTRA_CA_CERTS: /run/secrets/postgres_tls_ca
    OTTO_EDGE_OPERATIONS_TOKEN_FILE: /run/secrets/edge_operations_token
    OTTO_EDGE_STATE_DIRECTORY: /var/lib/otto-edge
  depends_on:
    control-a:
      condition: service_healthy
    caddy:
      condition: service_started
    edge-redis:
      condition: service_healthy
    postgres-tools:
      condition: service_healthy
  expose:
    - "7791"
  secrets:
    - edge_control_public_keys
    - edge_upstream_origins
    - edge_deployment_identity
    - edge_lease_token
    - edge_rate_limit_key
    - edge_redis_password
    - edge_redis_tls_ca
    - edge_execution_receipt_key
    - edge_operations_token
    - edge_ledger_postgres_password
    - postgres_tls_ca
  volumes:
    - ${OTTO_EDGE_PROVIDER_SECRETS_DIR:-./edge-provider-secrets}:/run/otto-edge-provider-secrets:ro
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    - /run/otto-runtime-secrets:rw,noexec,nosuid,size=2m,uid=1000,gid=1000,mode=0700
  networks:
    - backend
    - edge
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7791/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    start_period: 20s
    retries: 6
  logging:
    driver: json-file
    options:
      max-size: ${OTTO_EDGE_LOG_MAX_SIZE:-20m}
      max-file: ${OTTO_EDGE_LOG_MAX_FILES:-5}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_READ_SEARCH
    - SETGID
    - SETUID

services:
  etcd-1:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.21}
    restart: unless-stopped
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=otto-control-postgres
    volumes:
      - etcd_1_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
    security_opt: [no-new-privileges:true]

  etcd-2:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.21}
    restart: unless-stopped
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=otto-control-postgres
    volumes:
      - etcd_2_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
    security_opt: [no-new-privileges:true]

  etcd-3:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.21}
    restart: unless-stopped
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=otto-control-postgres
    volumes:
      - etcd_3_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
    security_opt: [no-new-privileges:true]

  postgres-1:
    <<: *postgres-common
    environment:
      PATRONI_NAME: postgres-1
    volumes:
      - postgres_1_data:/var/lib/postgresql/data
      - pgbackrest_repository:/var/lib/pgbackrest

  postgres-2:
    <<: *postgres-common
    environment:
      PATRONI_NAME: postgres-2
    volumes:
      - postgres_2_data:/var/lib/postgresql/data
      - pgbackrest_repository:/var/lib/pgbackrest

  postgres-3:
    <<: *postgres-common
    environment:
      PATRONI_NAME: postgres-3
    volumes:
      - postgres_3_data:/var/lib/postgresql/data
      - pgbackrest_repository:/var/lib/pgbackrest

  postgres-router:
    image: haproxy:3.1-alpine
    restart: unless-stopped
    depends_on:
      postgres-1: { condition: service_started }
      postgres-2: { condition: service_started }
      postgres-3: { condition: service_started }
    expose: ["5432"]
    volumes:
      - ./deploy/postgres-ha/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database, backend]
    security_opt: [no-new-privileges:true]

  postgres-tools:
    image: ${POSTGRES_HA_IMAGE:-otto-control-postgres-ha:local}
    build:
      context: .
      dockerfile: deploy/postgres-ha/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-router:
        condition: service_healthy
    environment:
      PGDATABASE: ${POSTGRES_DB:-otto_control}
      PGHOST: postgres-router
      PGPASSFILE: /tmp/.pgpass
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-otto_control}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_tls_ca
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password="$$(cat /run/secrets/postgres_password)"
        superuser_password="$$(cat /run/secrets/postgres_superuser_password)"
        {
          printf '%s:%s:%s:%s:%s\n' "$$PGHOST" "$$PGPORT" '*' "$$PGUSER" "$$password"
          printf '%s:%s:%s:%s:%s\n' "$$PGHOST" "$$PGPORT" '*' 'postgres' "$$superuser_password"
        } |
          gosu postgres sh -c 'umask 077; cat > "$$PGPASSFILE"'
        unset password superuser_password
        gosu postgres /usr/local/bin/otto-migrate-edge-ledger
        exec gosu postgres tail -f /dev/null
    secrets: [postgres_password, postgres_superuser_password, edge_ledger_postgres_password, postgres_tls_ca]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=$$PGHOST --port=$$PGPORT --username=$$PGUSER --dbname=$$PGDATABASE"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SETGID, SETUID]

  control-a:
    <<: *control-common

  control-b:
    <<: *control-common

  control-c:
    <<: *control-common

  federation-a:
    <<: *federation-common

  federation-b:
    <<: *federation-common

  federation-c:
    <<: *federation-common

  edge-redis:
    profiles: [edge, edge-rollout]
    image: ${OTTO_EDGE_REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    user: redis
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password="$$(cat /run/secrets/edge_redis_password)"
        umask 077
        {
          printf '%s\n' \
            'port 0' \
            'tls-port 6379' \
            'tls-cert-file /run/secrets/edge_redis_tls_cert' \
            'tls-key-file /run/secrets/edge_redis_tls_key' \
            'tls-ca-cert-file /run/secrets/edge_redis_tls_ca' \
            'tls-auth-clients no' \
            'appendonly yes' \
            'appendfsync everysec' \
            'save 300 10'
          printf 'requirepass %s\n' "$$password"
        } > /tmp/redis.conf
        unset password
        exec redis-server /tmp/redis.conf
    secrets:
      - edge_redis_password
      - edge_redis_tls_ca
      - edge_redis_tls_cert
      - edge_redis_tls_key
    volumes:
      - edge_redis_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m,mode=0700
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/edge_redis_password) redis-cli --tls --cacert /run/secrets/edge_redis_tls_ca -h edge-redis ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: ${OTTO_EDGE_LOG_MAX_SIZE:-20m}
        max-file: ${OTTO_EDGE_LOG_MAX_FILES:-5}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  edge-gateway:
    <<: *edge-gateway-common
    profiles: [edge]
    volumes:
      - edge_gateway_state:/var/lib/otto-edge
      - ${OTTO_EDGE_PROVIDER_SECRETS_DIR:-./edge-provider-secrets}:/run/otto-edge-provider-secrets:ro

  edge-gateway-canary:
    <<: *edge-gateway-common
    profiles: [edge-rollout]
    volumes:
      - edge_gateway_canary_state:/var/lib/otto-edge
      - ${OTTO_EDGE_PROVIDER_SECRETS_DIR:-./edge-provider-secrets}:/run/otto-edge-provider-secrets:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: ["${OTTO_CONTROL_ENV_FILE:-.env.production}"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        aliases:
          - ${CONTROL_DOMAIN}
    security_opt: [no-new-privileges:true]

  prometheus:
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.0-distroless}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    ports:
      - "127.0.0.1:9090:9090"
    secrets: [control_metrics_token, federation_metrics_token]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  postgres-pitr-drill:
    profiles: [ops]
    build:
      context: .
      dockerfile: deploy/postgres-ha/Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    user: root
    read_only: true
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      OTTO_PGBACKREST_CIPHER_FILE: /run/patroni/pgbackrest_cipher_pass
    command:
      - |
        gosu postgres sh -c 'umask 077; cat > /run/patroni/pgbackrest_cipher_pass' < /run/secrets/pgbackrest_cipher_pass
        gosu postgres sh -c 'umask 077; cat > /run/patroni/postgres_tls_ca.pem' < /run/secrets/postgres_tls_ca
        gosu postgres sh -c 'umask 077; cat > /run/patroni/postgres_tls_cert.pem' < /run/secrets/postgres_tls_cert
        gosu postgres sh -c 'umask 077; cat > /run/patroni/postgres_tls_key.pem' < /run/secrets/postgres_tls_key
        exec gosu postgres tail -f /dev/null
    secrets: [pgbackrest_cipher_pass, postgres_tls_ca, postgres_tls_cert, postgres_tls_key]
    volumes:
      - postgres_pitr_drill_data:/var/lib/postgresql/data
      - pgbackrest_repository:/var/lib/pgbackrest:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /run/patroni:rw,noexec,nosuid,size=1m,uid=999,gid=999,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,size=2m,mode=1777
      - /var/log/pgbackrest:rw,noexec,nosuid,size=16m,mode=1777
    networks: [database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SETGID, SETUID]

secrets:
  control_admin_token:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/control_admin_token
  control_token_secret:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/control_token_secret
  control_metrics_token:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/control_metrics_token
  federation_admin_token:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/federation_admin_token
  federation_metrics_token:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/federation_metrics_token
  postgres_password:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/postgres_password
  edge_ledger_postgres_password:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/edge_ledger_postgres_password
  postgres_superuser_password:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/postgres_superuser_password
  postgres_replication_password:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/postgres_replication_password
  pgbackrest_cipher_pass:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/pgbackrest_cipher_pass
  alert_webhook_secret:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/alert_webhook_secret
  audit_anchor_token:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/audit_anchor_token
  artifact_s3_access_key_id:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/artifact_s3_access_key_id
  artifact_s3_secret_access_key:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/artifact_s3_secret_access_key
  artifact_s3_session_token:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/artifact_s3_session_token
  postgres_tls_ca:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/postgres_tls_ca.pem
  postgres_tls_cert:
    file: ${OTTO_CONTROL_SECRETS_DIR:-./secrets}/postgres_tls_cert.pem
