name: otto-control

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  control:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "7788"
    secrets:
      - control_admin_token
      - control_token_secret
      - source: control_signer_private_key
        target: control_signer_private_key.pem
      - postgres_password
      - alert_webhook_secret
    volumes:
      - ./secrets:/run/otto-secrets:ro
      - ./backups/reports:/var/lib/otto-control/backup-reports:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - backend
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      control:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

secrets:
  control_admin_token:
    file: ./secrets/control_admin_token
  control_token_secret:
    file: ./secrets/control_token_secret
  control_signer_private_key:
    file: ./secrets/control_signer_private_key.pem
  postgres_password:
    file: ./secrets/postgres_password
  alert_webhook_secret:
    file: ./secrets/alert_webhook_secret

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
